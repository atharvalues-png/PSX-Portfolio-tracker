<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PSX Portfolio Tracker</title>
<meta name="theme-color" content="#0B1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PSX Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#0B1018;--s:#131A26;--s2:#1A2433;--line:#26334A;--tx:#EAF0F7;--dim:#8A99B0;--faint:#5B6B82;
    --gain:#1FCB8A;--loss:#FF5D6C;--gold:#E6B34A;--acc:#4C9DFF;--teal:#3FD1C7;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);
    font-family:-apple-system,ui-sans-serif,system-ui,sans-serif;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
  .hd{padding:calc(18px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(165deg,var(--s2),var(--bg) 85%)}
  .row{display:flex;align-items:center;justify-content:space-between}
  .dot{width:9px;height:9px;border-radius:9px;background:var(--gain);box-shadow:0 0 10px var(--gain)}
  .tag{letter-spacing:2px;font-size:11px;color:var(--dim);font-weight:700}
  .wrap{padding:0 16px 24px}
  .card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  .ct{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .big{font-size:31px;font-weight:700;letter-spacing:-.5px}
  .mv{font-size:18px;font-weight:700;color:var(--teal)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:13px}
  .stat .l{color:var(--dim);font-size:11px;font-weight:600}
  .stat .v{font-size:17px;font-weight:700;margin-top:5px}
  .stat .d{color:var(--faint);font-size:10px;margin-top:3px;line-height:1.3}
  .pos{color:var(--gain)}.neg{color:var(--loss)}.gld{color:var(--gold)}.tl{color:var(--teal)}
  input,button,select{font-family:inherit;font-variant-numeric:tabular-nums}
  .in{background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font-size:14px;width:100%}
  .px{width:80px;background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:4px 6px;font-size:13px}
  .lbl{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:6px}
  .hold{background:var(--s);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:8px}
  .pill{font-size:10px;font-weight:600;color:var(--dim);background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .pill.manual{color:var(--gold);border-color:var(--gold);background:rgba(230,179,74,.1)}
  .btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
  .btn.p{background:var(--acc);color:#04101F}.btn.g{background:var(--s);border:1px solid var(--line);color:var(--tx)}
  .btn.d{background:transparent;border:1px solid var(--loss);color:var(--loss)}
  .btn.sm{padding:5px 10px;font-size:12px;width:auto;border-radius:8px}
  .bar{height:7px;border-radius:7px;background:var(--s2);flex:1;overflow:hidden}
  .nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--s);border-top:1px solid var(--line);
    display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:40}
  .nav button{flex:1;background:0;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;cursor:pointer}
  .nav button.on{color:var(--acc)}
  .nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  canvas{max-height:170px}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .note{color:var(--faint);font-size:11px;line-height:1.5;margin-top:10px}
  .flag{background:rgba(76,157,255,.08);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:12px}
  .warnbar{background:rgba(230,179,74,.12);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;margin:12px 16px 0;text-align:center;line-height:1.4}
  .banner{background:rgba(230,179,74,.12);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;margin:0 0 4px;text-align:center}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-right:6px}
  .chip.f{color:var(--gain);background:rgba(31,203,138,.12)}
  .chip.s{color:var(--gold);background:rgba(230,179,74,.12)}
  .chip.m{color:var(--loss);background:rgba(255,93,108,.12)}
  .freshdot{width:7px;height:7px;border-radius:7px;display:inline-block}
  #gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
  #gate .lock{width:54px;height:54px;border-radius:16px;background:rgba(76,157,255,.14);display:flex;align-items:center;justify-content:center;font-size:26px}
  #gate input{font-size:30px;width:180px;text-align:center;letter-spacing:14px;background:var(--s);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 0;caret-color:transparent}
  #gerr{color:var(--loss);font-size:12px;height:14px;font-weight:600}
</style>
</head>
<body>
<div id="gate">
  <div class="lock">🔒</div>
  <div class="tag">PSX PORTFOLIO TRACKER</div>
  <div style="color:var(--dim);font-size:13px">Enter your PIN</div>
  <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" autofocus>
  <div id="gerr"></div>
</div>

<div class="hd">
  <div class="row"><div style="display:flex;align-items:center;gap:8px"><div class="dot"></div><span class="tag">PSX PORTFOLIO TRACKER</span></div>
    <span style="font-size:11px;color:var(--faint)" id="asof"></span></div>
  <div style="color:var(--dim);font-size:12px;margin-top:12px">Portfolio value <span style="color:var(--faint)">(holdings + cash)</span></div>
  <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
    <span class="big" id="pv"></span><span class="mv" id="pvA"></span></div>
  <div id="pl" style="display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:600;font-size:13px"></div>
</div>
<div id="warn"></div>
<div class="wrap" id="view"></div>
<div class="nav" id="nav"></div>

<script>
/* ============================================================
   PSX Portfolio Tracker — runs fully in your browser.
   No server, no accounts, no API keys, no live market feed.
   All prices are entered BY YOU and are NOT live PSX quotes.
   Everything is saved only in this browser (localStorage).
   Ships with SAMPLE data; replace it on the Holdings tab.
   ============================================================ */

/* ---- SAMPLE data (not real holdings) ---- */
function sampleData(){
  const now=Date.now();
  return {
    v:2,
    holdings:[
      {t:"OGDC",n:"Oil & Gas Dev",s:"Oil & Gas E&P",qty:100,avg:250,px:300,pxUpdated:now},
      {t:"MEBL",n:"Meezan Bank",s:"Banks",qty:200,avg:400,px:560,pxUpdated:now},
      {t:"LUCK",n:"Lucky Cement",s:"Cement",qty:50,avg:700,px:1050,pxUpdated:now-5*864e5},
      {t:"ENGRO",n:"Engro Corp",s:"Fertilizer",qty:80,avg:280,px:300,pxUpdated:null},
      {t:"FFC",n:"Fauji Fertilizer",s:"Fertilizer",qty:150,avg:110,px:125,pxUpdated:now},
      {t:"SYS",n:"Systems Ltd",s:"Technology",qty:100,avg:120,px:130,pxUpdated:now},
    ],
    dividends:[
      {id:"d1",ticker:"MEBL",date:"2026-08-28",net:3000},
      {id:"d2",ticker:"OGDC",date:"2026-05-22",net:1200},
    ],
    realized:0,
    fx:200, fxUpdated:now,
    cash:5000, goal:1000000, monthly:2000, ret:8,
    staleDays:3,
    isSample:true
  };
}
const PAL=["#4C9DFF","#1FCB8A","#E6B34A","#A678FF","#FF8A5C","#3FD1C7","#F25C9B","#7FB069","#FF5D6C","#5BC0EB"];
const KEY="psx_tracker_v2", OLDKEY="psx_tracker_v1";

/* ---- state + robust load ---- */
let D, tab="home";
function num(x,def){const n=+x;return isFinite(n)?n:(def||0);}
function normalize(o){
  if(!o||typeof o!=="object")return sampleData();
  o.v=2;
  if(!Array.isArray(o.holdings))o.holdings=[];
  o.holdings=o.holdings.map(h=>({t:(h.t||"").toString().toUpperCase(),n:h.n||"",s:h.s||"Other",
    qty:num(h.qty),avg:num(h.avg),px:num(h.px),
    pxUpdated:(typeof h.pxUpdated==="number"&&isFinite(h.pxUpdated))?h.pxUpdated:null}));
  if(!Array.isArray(o.dividends))o.dividends=[];
  o.dividends=o.dividends.map((d,i)=>({id:d.id||("d"+i+Date.now()),ticker:(d.ticker||"").toString().toUpperCase(),date:d.date||"",net:num(d.net)}));
  o.realized=num(o.realized);
  o.fx=num(o.fx,200)||200;
  o.fxUpdated=(typeof o.fxUpdated==="number"&&isFinite(o.fxUpdated))?o.fxUpdated:null;
  o.cash=num(o.cash);o.goal=num(o.goal,1000000)||1000000;o.monthly=num(o.monthly);o.ret=num(o.ret,8);
  o.staleDays=num(o.staleDays,3)||3;
  o.isSample=!!o.isSample;
  return o;
}
function migrate(old){
  // old public shape: holdings [{t,n,s,qty,avg,px,div}], fx, cash, goal, monthly, ret, isSample
  const o=sampleData(); o.isSample=false; o.holdings=[]; o.dividends=[];
  try{
    (old.holdings||[]).forEach(h=>{
      o.holdings.push({t:(h.t||"").toUpperCase(),n:h.n||"",s:h.s||"Other",qty:num(h.qty),avg:num(h.avg),px:num(h.px),pxUpdated:null});
      if(num(h.div)>0)o.dividends.push({id:"m"+Math.random().toString(36).slice(2),ticker:(h.t||"").toUpperCase(),date:"",net:num(h.div)});
    });
    o.fx=num(old.fx,200)||200; o.cash=num(old.cash); o.goal=num(old.goal,1000000)||1000000;
    o.monthly=num(old.monthly); o.ret=num(old.ret,8);
  }catch(e){}
  return normalize(o);
}
function load(){
  try{const s=localStorage.getItem(KEY);if(s){D=normalize(JSON.parse(s));return;}}catch(e){}
  try{const old=localStorage.getItem(OLDKEY);if(old){D=migrate(JSON.parse(old));save();return;}}catch(e){}
  D=sampleData();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){/* storage may be full/blocked; app still works in-memory */}}
load();

/* ---- helpers ---- */
const pkr=n=>"Rs "+(n==null||isNaN(n)?"0":Math.round(n).toLocaleString("en-PK"));
const aud=n=>"A$"+(n==null||isNaN(n)?"0":Math.round(n).toLocaleString("en-AU"));
const pct=n=>(n==null||isNaN(n)?"0.0%":(n>=0?"+":"")+n.toFixed(1)+"%");
function fmtDate(ts){if(!ts)return null;try{return new Date(ts).toLocaleDateString("en-AU",{day:"2-digit",month:"short"})+" "+new Date(ts).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});}catch(e){return null;}}
/* trading-day age: counts weekdays elapsed since ts (skips Sat/Sun). PSX public holidays are NOT accounted for — see note. */
function tradingDaysSince(ts){
  if(!ts)return null;
  const cur=new Date(ts);cur.setHours(0,0,0,0);
  const end=new Date();end.setHours(0,0,0,0);
  let c=0;while(cur<end){cur.setDate(cur.getDate()+1);const w=cur.getDay();if(w!==0&&w!==6)c++;}
  return c;
}
function priceStatus(h){
  if(h.pxUpdated==null)return "missing";
  const d=tradingDaysSince(h.pxUpdated);
  return d>D.staleDays?"stale":"fresh";
}
function calc(){
  let cost=0,mv=0;
  const rows=D.holdings.map(h=>{const c=h.qty*h.avg,m=h.qty*h.px;cost+=c;mv+=m;
    return{...h,c,m,g:m-c,gp:c?(m-c)/c*100:0,st:priceStatus(h)};});
  const div=D.dividends.reduce((a,d)=>a+num(d.net),0);
  const realized=num(D.realized);
  const unreal=mv-cost;
  const total=mv+num(D.cash);
  const totalReturn=unreal+realized+div;
  return{rows,cost,mv,div,realized,unreal,unrealPct:cost?unreal/cost*100:0,
    totalReturn,totalReturnPct:cost?totalReturn/cost*100:0,
    total,audTotal:total/D.fx,audCost:cost/D.fx,
    fresh:rows.filter(r=>r.st==="fresh").length,stale:rows.filter(r=>r.st==="stale").length,missing:rows.filter(r=>r.st==="missing").length};
}

/* ---- render ---- */
let charts=[];
function clearCharts(){while(charts.length){const c=charts.pop();try{c.destroy();}catch(e){}}}
function render(){
  const d=calc();
  document.getElementById("asof").textContent="Prices entered by you";
  document.getElementById("pv").textContent=pkr(d.total);
  document.getElementById("pvA").textContent=aud(d.audTotal);
  const up=d.unreal>=0;
  document.getElementById("pl").innerHTML=`<span class="${up?'pos':'neg'}">${up?'▲':'▼'} ${pkr(d.unreal)} (${pct(d.unrealPct)})</span><span style="color:var(--faint);font-weight:500">unrealized on holdings</span>`;
  let w="";
  if(D.isSample)w+=`<div class="banner">Showing SAMPLE data — go to Holdings to enter your own</div>`;
  if(d.stale+d.missing>0)w+=`<div class="banner" style="background:rgba(255,93,108,.1);border-color:var(--loss);color:var(--loss)">${d.stale} stale · ${d.missing} missing price${d.missing===1?"":"s"} — prices are manual, not live</div>`;
  document.getElementById("warn").innerHTML=w?`<div style="padding:0 16px">${w}</div>`:"";
  const v=document.getElementById("view");clearCharts();
  if(tab==="home"){v.innerHTML=homeHTML(d);homeCharts(d);}
  else if(tab==="hold"){v.innerHTML=holdHTML(d);bindHold();}
  else if(tab==="div"){v.innerHTML=divHTML(d);bindDiv();}
  else if(tab==="goal"){v.innerHTML=goalHTML(d);goalBind(d);}
  else if(tab==="set"){v.innerHTML=setHTML(d);setBind();}
  renderNav();
}

function homeHTML(d){
  return `<div class="card"><div class="ct">RETURN BREAKDOWN</div>
    <div class="grid" style="margin-top:0">
      <div class="stat"><div class="l">Unrealized P&L</div><div class="v ${d.unreal>=0?'pos':'neg'}">${pkr(d.unreal)}</div><div class="d">current holdings vs cost · ${pct(d.unrealPct)}</div></div>
      <div class="stat"><div class="l">Realized P&L</div><div class="v ${d.realized>=0?'pos':'neg'}">${pkr(d.realized)}</div><div class="d">from shares you've sold (you enter in Settings)</div></div>
      <div class="stat"><div class="l gld">Dividends received</div><div class="v gld">${pkr(d.div)}</div><div class="d">net amounts you've logged</div></div>
      <div class="stat"><div class="l tl">Total return</div><div class="v tl">${pkr(d.totalReturn)}</div><div class="d">unrealized + realized + dividends · ${pct(d.totalReturnPct)} on cost</div></div>
    </div>
    <div class="note">Each figure is a separate, labelled measure. "Total return" sums them against your invested cost of ${pkr(d.cost)} — it does not include cash or reinvestment timing.</div></div>

  <div class="card"><div class="ct">PRICE FRESHNESS</div>
    <div style="margin-bottom:8px"><span class="chip f">● ${d.fresh} fresh</span><span class="chip s">● ${d.stale} stale</span><span class="chip m">● ${d.missing} missing</span></div>
    <div class="note" style="margin-top:0">All prices are <b style="color:var(--gold)">MANUAL — NOT LIVE</b>. A price is "stale" after ${D.staleDays} trading day${D.staleDays===1?"":"s"} without an update (weekends skipped; PSX holidays not tracked). Update or confirm prices on the Holdings tab.</div></div>

  <div class="card"><div class="ct">SECTOR ALLOCATION</div><div style="display:flex;align-items:center;gap:10px">
    <div style="width:140px"><canvas id="cS" style="max-height:140px"></canvas></div><div id="sleg" style="flex:1"></div></div></div>
  <div class="card"><div class="ct">PERFORMANCE BY HOLDING</div><div id="perf"></div></div>
  <div class="card"><div class="ct">AUD VIEW</div>
    <div class="row"><span style="color:var(--dim);font-size:13px">Value at current rate</span><b class="tl">${aud(d.audTotal)}</b></div>
    <div class="note" style="margin-top:8px">Converted at <b style="color:var(--tx)">1 AUD = ${D.fx} PKR</b>${D.fxUpdated?` (set ${fmtDate(D.fxUpdated)})`:" (rate not set)"}. This is today's AUD-equivalent of your PKR value — <b>not</b> the actual AUD you invested, which used the exchange rate on each purchase date. Set the rate in Settings.</div></div>`;
}
function homeCharts(d){
  if(d.rows.length===0){document.getElementById("sleg").innerHTML="<span style='color:var(--faint);font-size:13px'>No holdings yet.</span>";document.getElementById("perf").innerHTML="";return;}
  const sa={};d.rows.forEach(r=>sa[r.s]=(sa[r.s]||0)+r.m);
  const se=Object.entries(sa).map(([n,val],i)=>({n,val,c:PAL[i%PAL.length]})).sort((a,b)=>b.val-a.val);
  charts.push(new Chart(document.getElementById("cS"),{type:"doughnut",data:{labels:se.map(s=>s.n),datasets:[{data:se.map(s=>s.val),backgroundColor:se.map(s=>s.c),borderWidth:0}]},options:{plugins:{legend:{display:false}},cutout:"62%",responsive:true,maintainAspectRatio:false}}));
  document.getElementById("sleg").innerHTML=se.slice(0,6).map(s=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0"><span style="width:9px;height:9px;border-radius:3px;background:${s.c}"></span><b>${s.n}</b><span style="margin-left:auto;color:var(--dim)">${d.mv?(s.val/d.mv*100).toFixed(0):0}%</span></div>`).join("");
  const perf=[...d.rows].sort((a,b)=>b.gp-a.gp);const mx=Math.max(1,...perf.map(r=>Math.abs(r.gp)));
  document.getElementById("perf").innerHTML=perf.map(r=>{const w=Math.abs(r.gp)/mx*50,up=r.gp>=0;
    return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0"><span style="width:60px;font-weight:600">${r.t}</span>
      <div style="flex:1;display:flex;align-items:center;height:16px"><div style="width:50%;display:flex;justify-content:flex-end">${up?"":`<div style="width:${w*2}%;height:8px;background:var(--loss);border-radius:3px"></div>`}</div><div style="width:1px;height:16px;background:var(--line)"></div><div style="width:50%">${up?`<div style="width:${w*2}%;height:8px;background:var(--gain);border-radius:3px"></div>`:""}</div></div>
      <span style="width:52px;text-align:right;font-weight:600" class="${up?'pos':'neg'}">${pct(r.gp)}</span></div>`;}).join("");
}

function holdHTML(d){
  return `<div class="card"><div class="ct">ADD A HOLDING</div>
    <div class="lbl">Ticker</div><input class="in" id="f_t" placeholder="e.g. OGDC">
    <div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1"><div class="lbl">Company (optional)</div><input class="in" id="f_n" placeholder="name"></div>
      <div style="flex:1"><div class="lbl">Sector</div><input class="in" id="f_s" placeholder="e.g. Banks"></div></div>
    <div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1"><div class="lbl">Shares</div><input class="in" id="f_q" type="number" inputmode="decimal"></div>
      <div style="flex:1"><div class="lbl">Avg buy price</div><input class="in" id="f_a" type="number" inputmode="decimal"></div></div>
    <div style="margin-top:10px"><div class="lbl">Current price (you enter — not live)</div><input class="in" id="f_p" type="number" inputmode="decimal"></div>
    <div style="margin-top:12px"><button class="btn p" id="addBtn">+ Add holding</button></div></div>
  <div style="font-size:12px;color:var(--dim);font-weight:700;margin-top:16px">${d.rows.length} HOLDING(S)</div>
  ${d.rows.map((r,i)=>{const up=r.g>=0;
    const dotc=r.st==="fresh"?"var(--gain)":r.st==="stale"?"var(--gold)":"var(--loss)";
    const upd=r.pxUpdated?("Updated "+fmtDate(r.pxUpdated)):"Never updated";
    const stl=r.st==="stale"?" · STALE":r.st==="missing"?" · NO DATE":"";
    return `<div class="hold"><div class="row">
    <div><div style="display:flex;align-items:center;gap:7px"><b style="font-size:15px">${r.t}</b>${r.s?`<span class="pill">${r.s}</span>`:""}</div>
      <div style="color:var(--dim);font-size:11px;margin-top:2px">${r.n||""} ${d.mv?"· "+(r.m/d.mv*100).toFixed(1)+"%":""}</div></div>
    <div style="text-align:right"><div style="font-weight:700">${pkr(r.m)}</div><div class="${up?'pos':'neg'}" style="font-size:12px;font-weight:600">${pct(r.gp)}</div></div></div>
    <div style="display:flex;gap:8px;margin-top:10px;font-size:11px;color:var(--dim);align-items:center;flex-wrap:wrap">
      <span>Shares <input class="px" style="width:64px" data-i="${i}" data-k="qty" type="number" value="${r.qty}"></span>
      <span>Avg <input class="px" style="width:64px" data-i="${i}" data-k="avg" type="number" value="${r.avg}"></span>
      <span>Price <input class="px" style="width:72px" data-i="${i}" data-k="px" type="number" value="${r.px}"></span></div>
    <div style="display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap">
      <span class="pill manual">MANUAL</span>
      <span style="font-size:10.5px;color:${dotc};display:flex;align-items:center;gap:5px"><span class="freshdot" style="background:${dotc}"></span>${upd}${stl}</span>
      <button class="btn g sm" data-confirm="${i}" style="margin-left:auto">✓ Still current</button>
      <button class="btn d sm" data-del="${i}">Delete</button></div></div>`;}).join("")}
  <div class="note">Tap a Price to update it (the date stamps automatically). "✓ Still current" re-stamps today's date without changing the number. Prices are entered by you and are <b style="color:var(--gold)">not live PSX quotes</b>.</div>`;
}
function bindHold(){
  const add=document.getElementById("addBtn");
  add.onclick=()=>{
    const t=(document.getElementById("f_t").value||"").trim().toUpperCase();if(!t)return;
    if(D.isSample){D.holdings=[];D.dividends=[];D.isSample=false;}
    D.holdings.push({t,n:(document.getElementById("f_n").value||"").trim(),s:(document.getElementById("f_s").value||"").trim()||"Other",
      qty:num(document.getElementById("f_q").value),avg:num(document.getElementById("f_a").value),
      px:num(document.getElementById("f_p").value),pxUpdated:Date.now()});
    save();render();
  };
  document.querySelectorAll(".px[data-i]").forEach(inp=>inp.onchange=e=>{
    const i=+e.target.dataset.i,k=e.target.dataset.k;
    D.holdings[i][k]=num(e.target.value);
    if(k==="px")D.holdings[i].pxUpdated=Date.now(); // only price edits re-stamp; qty/avg don't touch other settings
    save();render();
  });
  document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=e=>{D.holdings[+e.currentTarget.dataset.confirm].pxUpdated=Date.now();save();render();});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{D.holdings.splice(+e.currentTarget.dataset.del,1);save();render();});
}

function divHTML(d){
  const list=[...D.dividends].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<div class="card" style="background:linear-gradient(135deg,rgba(230,179,74,.15),var(--s))">
    <div class="ct" style="color:var(--gold)">DIVIDENDS RECEIVED</div>
    <div style="display:flex;align-items:baseline;gap:10px"><span class="big" style="font-size:26px">${pkr(d.div)}</span><span class="mv" style="color:var(--gold)">${aud(d.div/D.fx)}</span></div>
    <div class="note" style="margin-top:6px">Total of the net amounts you've logged below. ${d.cost?("That's "+(d.div/d.cost*100).toFixed(1)+"% of your cost basis so far — a <b>yield-on-cost to date</b>, not a forward/annual dividend yield."):""}</div></div>
  <div class="card"><div class="ct">LOG A DIVIDEND</div>
    <div style="display:flex;gap:10px"><div style="flex:1"><div class="lbl">Ticker</div><input class="in" id="d_t" placeholder="e.g. MEBL"></div>
      <div style="flex:1"><div class="lbl">Date</div><input class="in" id="d_d" type="date"></div></div>
    <div style="margin-top:10px"><div class="lbl">Net amount received (PKR, after tax)</div><input class="in" id="d_n" type="number" inputmode="decimal"></div>
    <div style="margin-top:12px"><button class="btn p" id="dAdd">+ Add dividend</button></div>
    <div class="note">Simple per-event log: ticker, date, net amount. Enter the amount actually received after tax.</div></div>
  <div style="font-size:12px;color:var(--dim);font-weight:700;margin-top:16px">${list.length} PAYMENT(S)</div>
  ${list.map(x=>`<div class="hold" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b>${x.ticker}</b> <span style="color:var(--faint);font-size:12px">${x.date||"no date"}</span></div><b>${pkr(x.net)}</b><button class="btn d sm" data-dd="${x.id}">✕</button></div>`).join("")}`;
}
function bindDiv(){
  document.getElementById("dAdd").onclick=()=>{
    const t=(document.getElementById("d_t").value||"").trim().toUpperCase();if(!t)return;
    if(D.isSample){D.dividends=[];D.holdings.forEach(h=>{});D.isSample=false;}
    D.dividends.push({id:"d"+Date.now()+Math.random().toString(36).slice(2,5),ticker:t,date:document.getElementById("d_d").value||"",net:num(document.getElementById("d_n").value)});
    save();render();
  };
  document.querySelectorAll("[data-dd]").forEach(b=>b.onclick=e=>{D.dividends=D.dividends.filter(x=>x.id!==e.currentTarget.dataset.dd);save();render();});
}

function goalHTML(d){
  const prog=D.goal?d.audTotal/D.goal*100:0;
  return `<div class="card" style="background:linear-gradient(135deg,var(--s2),var(--s))">
    <div class="ct" style="color:var(--acc)">GOAL · ${aud(D.goal)} INVESTED</div>
    <div style="display:flex;align-items:baseline;gap:8px"><span class="big" style="font-size:26px">${aud(d.audTotal)}</span><span style="color:var(--dim);font-size:13px">of ${aud(D.goal)}</span><span style="margin-left:auto;font-size:20px;font-weight:700;color:var(--acc)">${prog.toFixed(1)}%</span></div>
    <div class="bar" style="height:10px;margin-top:10px"><div style="width:${Math.max(Math.min(prog,100),1.5)}%;height:10px;background:linear-gradient(90deg,var(--acc),var(--teal))"></div></div>
    <div style="margin-top:12px;font-size:13px;color:var(--dim)" id="gyears"></div></div>
  <div class="card"><div class="ct">PROJECTED PATH (AUD)</div><canvas id="cP"></canvas></div>
  <div class="card"><div class="ct">ADJUST THE PLAN</div>
    <div style="margin-bottom:14px"><div class="row"><span style="color:var(--dim);font-size:12.5px">Monthly contribution</span><b id="ml"></b></div><input type="range" id="mo" min="0" max="10000" step="100" value="${D.monthly}"></div>
    <div><div class="row"><span style="color:var(--dim);font-size:12.5px">Assumed annual return (AUD)</span><b id="rl"></b></div><input type="range" id="re" min="3" max="15" step="0.5" value="${D.ret}"></div></div>
  <div class="flag"><b>Assumptions:</b> growth compounds monthly on your current AUD value (${aud(d.audTotal)}) plus the monthly contribution, at the return you set. It does not model currency moves, dividends reinvested, tax, or market volatility. Projections are estimates, not guarantees, and not financial advice.</div>`;
}
function goalBind(d){
  const start=d.audTotal;let ch;
  function yrs(mo,r){let b=start;const mr=Math.pow(1+r/100,1/12)-1;for(let m=1;m<=720;m++){b=b*(1+mr)+mo;if(b>=D.goal)return m/12;}return null;}
  function proj(mo,r){const p=[];let b=start;const mr=Math.pow(1+r/100,1/12)-1;const yr=new Date().getFullYear();for(let y=0;y<=25;y++){p.push({y:yr+y,v:Math.round(b)});for(let m=0;m<12;m++)b=b*(1+mr)+mo;}return p;}
  function up(){
    const mo=num(document.getElementById("mo").value),r=num(document.getElementById("re").value,8);D.monthly=mo;D.ret=r;save();
    document.getElementById("ml").textContent=aud(mo);document.getElementById("rl").textContent=r+"%";
    const y=yrs(mo,r);document.getElementById("gyears").innerHTML=y?`At <b style="color:var(--tx)">${aud(mo)}/mo</b> and <b style="color:var(--tx)">${r}%</b>, you'd reach the goal in <b style="color:var(--teal)">~${y.toFixed(0)} years</b> — around <b style="color:var(--teal)">${Math.round(new Date().getFullYear()+y)}</b>.`:"Raise contribution or return to reach the goal within 60 years.";
    const p=proj(mo,r);if(ch){try{ch.destroy();}catch(e){}}
    ch=new Chart(document.getElementById("cP"),{type:"line",data:{labels:p.map(x=>x.y),datasets:[{data:p.map(x=>x.v),borderColor:"#3FD1C7",backgroundColor:"rgba(63,209,199,.18)",fill:true,tension:.3,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#5B6B82",font:{size:9},maxTicksLimit:7}},y:{grid:{color:"#26334A"},ticks:{color:"#5B6B82",font:{size:9},callback:v=>(v/1e6).toFixed(1)+"M"}}}}});
    charts.push(ch);
  }
  document.getElementById("mo").oninput=up;document.getElementById("re").oninput=up;up();
}

function setHTML(d){
  return `<div class="card"><div class="ct">PORTFOLIO SETTINGS</div>
    <div class="lbl">AUD → PKR rate (PKR per 1 AUD)${D.fxUpdated?` · set ${fmtDate(D.fxUpdated)}`:""}</div><input class="in" id="s_fx" type="number" value="${D.fx}">
    <div class="lbl" style="margin-top:12px">Cash balance (PKR)</div><input class="in" id="s_cash" type="number" value="${D.cash}">
    <div class="lbl" style="margin-top:12px">Realized P&L so far (PKR, from shares sold)</div><input class="in" id="s_real" type="number" value="${D.realized}">
    <div class="lbl" style="margin-top:12px">Stale-price warning after (trading days)</div><input class="in" id="s_stale" type="number" value="${D.staleDays}">
    <div class="lbl" style="margin-top:12px">Goal — AUD invested</div><input class="in" id="s_goal" type="number" value="${D.goal}">
    <div style="margin-top:14px"><button class="btn p" id="saveSet">Save settings</button></div>
    <div class="note">The FX rate converts your current PKR value to an AUD-equivalent. It is entered by you, not fetched live, and is separate from the exchange rate you actually paid on past purchases.</div></div>
  <div class="card"><div class="ct">BACKUP & MOVE TO ANOTHER PHONE</div>
    <button class="btn p" id="expFile" style="margin-bottom:10px">⬇ Export backup file</button>
    <input id="impFile" type="file" accept="application/json" style="display:none">
    <button class="btn g" id="impBtn" style="margin-bottom:10px">⬆ Import backup file</button>
    <button class="btn g" id="copyCode" style="margin-bottom:10px">Copy sync code</button>
    <button class="btn g" id="pasteCode">Paste sync code</button>
    <div id="syncArea"></div>
    <div id="setmsg" class="note" style="color:var(--acc);min-height:14px"></div></div>
  <div class="card"><div class="ct">DATA</div>
    <button class="btn g" id="loadSample" style="margin-bottom:10px">Load sample data</button>
    <button class="btn d" id="clearAll">Clear everything (start empty)</button></div>
  <div class="card"><div class="ct">ABOUT</div><div style="font-size:12.5px;color:var(--dim);line-height:1.6">A private PSX portfolio tracker that runs entirely in your browser. No accounts, no servers, no live market feed — <b>all prices are entered by you</b>. Nothing leaves your device. PIN-locked on open. Not financial advice.</div></div>`;
}
function setBind(){
  const msg=t=>{const e=document.getElementById("setmsg");if(e)e.textContent=t;};
  document.getElementById("saveSet").onclick=()=>{
    const nf=num(document.getElementById("s_fx").value,D.fx)||D.fx;
    if(nf!==D.fx){D.fx=nf;D.fxUpdated=Date.now();}
    D.cash=num(document.getElementById("s_cash").value);
    D.realized=num(document.getElementById("s_real").value);
    D.staleDays=Math.max(1,num(document.getElementById("s_stale").value,3))||3;
    D.goal=num(document.getElementById("s_goal").value,1000000)||1000000;
    save();render();
  };
  document.getElementById("expFile").onclick=()=>{try{const b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="psx-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}catch(e){msg("Export failed on this browser.");}};
  document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.holdings)throw 0;D=normalize(o);save();render();}catch(x){msg("That file could not be read as a backup.");}};
  document.getElementById("copyCode").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(D));msg("Sync code copied — paste it into this app on your other phone.");}catch(x){msg("Copy blocked — use Export backup file instead.");}};
  document.getElementById("pasteCode").onclick=()=>{document.getElementById("syncArea").innerHTML='<textarea id="pc" class="in" style="height:72px;margin-top:10px" placeholder="Paste sync code here"></textarea><button class="btn p" id="applyPc" style="margin-top:8px">Apply sync code</button>';document.getElementById("applyPc").onclick=()=>{try{const o=JSON.parse(document.getElementById("pc").value);if(!o.holdings)throw 0;D=normalize(o);save();render();}catch(x){msg("That sync code was not valid.");}};};
  document.getElementById("loadSample").onclick=()=>{D=sampleData();save();tab="home";render();};
  document.getElementById("clearAll").onclick=()=>{if(confirm("Clear all holdings, dividends and settings?")){D=sampleData();D.holdings=[];D.dividends=[];D.realized=0;D.cash=0;D.isSample=false;save();render();}};
}

  document.getElementById("nav").innerHTML=T.map(([k,l,p])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><svg viewBox="0 0 24 24"><path d="${p}"/></svg>${l}</button>`).join("");
}

/* ---- PIN gate: asks every time the app opens. Change PIN to your own 4 digits. ---- */
const PIN="1994";
const gp=document.getElementById("pin");
gp.addEventListener("input",()=>{
  if(gp.value.length>=PIN.length){
    if(gp.value===PIN){const g=document.getElementById("gate");if(g)g.remove();render();}

});
